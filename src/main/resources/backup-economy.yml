# Backup economy configuration
# Disabled by default. Enable when you want a fallback economy provider.

enabled: false

# Choose provider: "internal" or "vault"
provider: "internal"

internal:
  # Starting balance for new accounts when using the internal provider
  starting_balance: 0
  # Whether accounts can go negative when withdrawing for taxes
  allow_negative_balance: false

vault:
  # If using an external provider (Vault), configure plugin details here
  plugin: "Vault"
  account: ""
  use_virtual: true

# Behavior settings
behavior:
  # If true, the backup economy will be used as a fallback when primary fails
  use_as_fallback: true
  # Whether to log backup-economy transactions for debugging/audit
  log_transactions: true
