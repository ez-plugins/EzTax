debug: false

# Group-based tax rates (requires Vault permission groups)
# If enabled, player's group tax rate will override the default percentage
# Players without a group or with unknown groups will use the fallback rate
group-taxes:
  enabled: false
  fallback-rate: 1.0
  groups:
    vip:
      transaction-tax: 0.5
      wealth-tax: 1.0
    premium:
      transaction-tax: 0.25
      wealth-tax: 0.5
    default:
      transaction-tax: 1.0
      wealth-tax: 2.0

transaction-tax:
  enabled: true
  apply-on-withdraw: true
  apply-on-deposit: false
  percentage: 1.0
  minimum-fee: 1.0
  # Commands to intercept (chat-based) for applying transaction tax. Names without leading '/'.
  # If capture-commands is true, EzTax will NOT register the taxed Vault economy wrapper
  # and will instead apply transaction tax when these commands are used.
  commands:
    - pay
  # When true, use command/chat interception for transaction tax; otherwise use Vault economy wrapping when available.
  capture-commands: false

wealth-tax:
  enabled: true
  threshold: 250000
  percentage: 2.0
  interval: DAILY
  # Optional progressive brackets. Define named entries with `limit` (upper bound)
  # and `percent` (tax percent applied to amounts within that bracket).
  # Amounts above the highest bracket are taxed at `percentage` above.
  # Example:
  # brackets:
  #   low:
  #     limit: 500000
  #     percent: 1.0
  #   mid:
  #     limit: 1000000
  #     percent: 2.0

inactivity-fee:
  enabled: true
  days-inactive: 30
  flat-fee: 500
  percentage: 0.0

death-fee:
  enabled: true
  percentage: 0.5
  max-loss: 5000
  disabled-worlds: []

server-treasury:
  enabled: true

# Storage configuration for persisted statistics (default: YML)
storage:
  type: yml    # supported: yml, mysql
  file: stats.yml
  mysql:
    # When using mysql, set host/port/database/user/password. Leave empty to keep using YML.
    host: localhost
    port: 3306
    database: eztax
    user: root
    password: ""
    table: eztax_stats
