name: CI

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk
          check-latest: true

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Clone and install MockBukkit (dev/26.1.1)
        run: |
          git clone --depth=1 --branch dev/26.1.1 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit
          echo "MOCKBUKKIT_VERSION=dev-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          ./gradlew publishToMavenLocal --no-daemon -q -x javadoc

      - name: Run tests with coverage
        run: mvn -B -Dmockbukkit.version=${{ env.MOCKBUKKIT_VERSION }} test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

  feature-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk
          check-latest: true

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-feature-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-feature-

      - name: Clone and install MockBukkit (dev/26.1.1)
        run: |
          git clone --depth=1 --branch dev/26.1.1 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          cd /tmp/MockBukkit
          echo "MOCKBUKKIT_VERSION=dev-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          ./gradlew publishToMavenLocal --no-daemon -q -x javadoc

      - name: Run feature tests
        run: mvn -B -Dmockbukkit.version=${{ env.MOCKBUKKIT_VERSION }} -Pfeature-tests -Dtest=*FeatureTest test
